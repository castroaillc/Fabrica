services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: fabrica
      POSTGRES_DB: fabrica
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrica -d fabrica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
